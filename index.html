<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Game Arcade — 纯前端小游戏合集">
  <title>Game Arcade · 游戏合集</title>
  <!-- PWA(清单与图标在根目录) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <!-- iOS 主屏 Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="游戏合集">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="lobby.css">
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>🎮 Game Arcade</h1>
      <p class="hero-sub">纯前端小游戏合集 · 无需安装 · 离线可玩</p>
    </header>

    <main class="grid">
      <a class="card" href="games/schulte/index.html" data-best-key="schulte" data-best-type="time">
        <div class="card-icon">🔢</div>
        <div class="card-body">
          <h2>舒尔特方块</h2>
          <p>按顺序点击数字,经典的注意力训练</p>
        </div>
        <div class="card-best"><span class="best-label">最快</span><span class="best-value">--</span></div>
      </a>

      <a class="card" href="games/tetris/index.html" data-best-key="tetris" data-best-type="score">
        <div class="card-icon">🧱</div>
        <div class="card-body">
          <h2>俄罗斯方块</h2>
          <p>现代标准规则:Hold、幽灵投影、硬降与等级加速</p>
        </div>
        <div class="card-best"><span class="best-label">最高分</span><span class="best-value">--</span></div>
      </a>

      <div class="card card-more">
        <div class="card-icon">✨</div>
        <div class="card-body">
          <h2>更多游戏</h2>
          <p>持续开发中,敬请期待</p>
        </div>
      </div>
    </main>

    <footer class="foot-tip">成绩仅保存在本设备浏览器中</footer>
  </div>

  <script>
    // 卡片上显示各游戏的最高成绩(localStorage 键与各游戏一致)
    (function () {
      function getJSON(key, fallback) {
        try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
        catch (e) { return fallback; }
      }
      document.querySelectorAll('.card[data-best-key]').forEach(function (card) {
        var key = card.dataset.bestKey;
        var el = card.querySelector('.best-value');
        if (key === 'schulte') {
          var best = getJSON('schulte.best', {});
          var fastest = null;
          for (var size in best) {
            if (!fastest || best[size].time < fastest.time) fastest = best[size];
          }
          if (fastest) el.textContent = fastest.time.toFixed(2) + 's';
        } else if (key === 'tetris') {
          var tBest = getJSON('tetris.best', null);
          if (tBest) el.textContent = String(tBest.score).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
      });
    })();
  </script>
</body>
</html>
